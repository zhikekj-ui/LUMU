<?xml version="1.0" encoding="UTF-8"?>
<!--
  LUMU App Icon / LumuMark — 官方矢量主源
  - 深空黑底圆角方 + 青色细描边
  - 中央青色多面体记忆核 + 两点琥珀眼 + 破缺轨道环
  - 颜色：#7fdcff（青）/ #ffb454（琥珀）/ #05080f（深空黑底）
  - 用途：LUMU 主产品 / 官网 / 管理端 / favicon / PWA / Apple Touch
  - 适配：SVG 可任意缩放；导出 PNG 16/32/180/192/512 时使用 inkscape/ImageMagick/svglib 任意工具
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="LUMU">
  <title>LUMU</title>
  <defs>
    <!-- 记忆核面体渐变（青→略深青，给面以微立体感） -->
    <linearGradient id="coreFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aef0ff"/>
      <stop offset=".55" stop-color="#7fdcff"/>
      <stop offset="1" stop-color="#46b8e0"/>
    </linearGradient>
    <linearGradient id="coreFaceDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc7e6"/>
      <stop offset="1" stop-color="#2a8aaa"/>
    </linearGradient>
    <!-- 顶部小三角面（更亮） -->
    <linearGradient id="coreTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbf6ff"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <!-- 琥珀眼微辉光（收敛，绝不变成发光球） -->
    <radialGradient id="eye" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset=".55" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#d68a26"/>
    </radialGradient>
  </defs>

  <!-- 圆角黑底卡片 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="#05080f"/>
  <!-- 青色细描边（内嵌避裁切） -->
  <rect x="22" y="22" width="980" height="980" rx="200" ry="200"
        fill="none" stroke="#7fdcff" stroke-width="14" stroke-opacity=".95"/>

  <!-- 破缺轨道环（细线，绕核心倾斜，左下→右上，被记忆核部分遮住） -->
  <g transform="translate(512 540) rotate(-22)">
    <ellipse cx="0" cy="0" rx="360" ry="118" fill="none"
             stroke="#7fdcff" stroke-width="14" stroke-opacity=".85"/>
    <!-- 破口：右上一小段用背景色擦除形成碎片感 -->
    <path d="M 120 -98 A 360 118 0 0 1 230 -56"
          stroke="#05080f" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- 碎片点（4 个小段，强化"轨道碎片"语义） -->
    <circle cx="-340" cy="40"  r="7" fill="#7fdcff" fill-opacity=".9"/>
    <circle cx="330"  cy="-46" r="6" fill="#7fdcff" fill-opacity=".9"/>
    <circle cx="280"  cy="62"  r="5" fill="#7fdcff" fill-opacity=".75"/>
    <circle cx="-300" cy="-58" r="5" fill="#7fdcff" fill-opacity=".75"/>
  </g>

  <!-- 记忆核：六面体（菱形主体 + 上下三角面，给"多面晶体"质感） -->
  <g transform="translate(512 540)">
    <!-- 下半深色阴影面 -->
    <polygon points="0,150 -150,30 0,-90 150,30" fill="url(#coreFaceDark)" opacity=".75"/>
    <!-- 主体大菱形 -->
    <polygon points="0,-110 -150,30 0,170 150,30" fill="url(#coreFace)"/>
    <!-- 顶部小三角（更亮） -->
    <polygon points="0,-110 -150,30 150,30" fill="url(#coreTop)" opacity=".9"/>
    <!-- 左侧暗面（多面体棱线感） -->
    <polygon points="0,-110 -75,-30 -150,30 0,30" fill="#3a9fc2" opacity=".55"/>
    <!-- 中央棱线（极细高光） -->
    <line x1="0" y1="-110" x2="0" y2="170" stroke="#eaf9ff" stroke-width="3" stroke-opacity=".45"/>
    <line x1="-150" y1="30" x2="150" y2="30" stroke="#0a3b4d" stroke-width="3" stroke-opacity=".55"/>

    <!-- 两只琥珀眼（点状，不变大发光球） -->
    <circle cx="-42" cy="0" r="20" fill="url(#eye)"/>
    <circle cx="42"  cy="0" r="20" fill="url(#eye)"/>
    <!-- 眼中极小高光点 -->
    <circle cx="-48" cy="-6" r="5" fill="#fff4d8" opacity=".9"/>
    <circle cx="36"  cy="-6" r="5" fill="#fff4d8" opacity=".9"/>
  </g>
</svg>
