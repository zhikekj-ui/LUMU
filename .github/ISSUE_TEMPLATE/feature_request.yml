name: 功能建议
description: 希望 LUMU 能多做一件事
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，不用直接说方案。真实场景比功能点更有价值。
      placeholder: 我每周都要把几个群里的消息整理成周报，现在得手动复制……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 如果已经有想法就写，没有也没关系

  - type: dropdown
    id: kind
    attributes:
      label: 这更像是
      options:
        - 一个新工具（需要写代码）
        - 一个技能包（用 SKILL.md 就能实现）
        - 界面/交互改进
        - 新的渠道接入
        - 还不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在你是怎么绕过去的
      description: 有没有临时办法，或者别的工具是怎么做的
