name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: 代码风格（非阻断）
    runs-on: ubuntu-latest
    # 存量代码尚未全量格式化，这里只做提示，不阻断合并。
    # 新增代码请在提交前自行跑 black . 与 ruff check .
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install black ruff

      - name: Black check
        run: black --check . || true

      - name: Ruff check
        run: ruff check . || true

  docker:
    name: 镜像构建与探活
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lumu:ci .

      - name: Boot container and probe /health
        run: |
          docker run -d --name lumu-ci -p 127.0.0.1:38473:38473 lumu:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:38473/health >/dev/null 2>&1; then
              echo "health OK after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed — container logs:"
          docker logs lumu-ci
          exit 1

      - name: Teardown
        if: always()
        run: docker rm -f lumu-ci || true
