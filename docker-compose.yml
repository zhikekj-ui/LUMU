# LUMU —— 个人智能体，一条命令跑起来
#
#   docker compose up -d
#   docker compose logs -f agent      # 查看启动日志
#
#   升级：拉取新代码后执行  docker compose up -d --build
#
# 默认是「单容器 + SQLite」的个人模式，不需要数据库，不需要 Redis。
# 需要 Postgres / Redis 的重型部署见文件末尾的 scale 配置段。

services:
  agent:
    build: .
    image: lumu:latest
    container_name: lumu-agent

    # 只映射到宿主机环回地址：默认只有这台机器能访问。
    # 想让局域网其他设备访问，改成 "38473:38473"，
    # 此时务必确认你已经理解 SECURITY.md 中的风险说明。
    ports:
      - "127.0.0.1:38473:38473"

    environment:
      # 容器内必须绑 0.0.0.0，端口边界由上面的 ports 控制
      HOST: "0.0.0.0"
      PORT: "38473"
      LOG_LEVEL: "INFO"
      # 访问守卫默认关闭、打开即用、零门禁；如需固定口令门禁，取消注释并填随机串
      # （配合 .env 里的 LUMU_TOKEN 启用守卫）
      # LUMU_TOKEN: "change-me-to-a-long-random-string"

    # 自动加载同目录的 .env（由 .env.example 复制而来，可含模型 Key 等配置）。
    # 没有 .env 也能启动，模型 Key 也可在 Web 界面「设置」里配。
    env_file:
      - .env

    volumes:
      # 你的全部数据（对话、记忆、知识库、配置）都在这里，删容器不丢
      - ./data:/app/data
      # 自写技能包：放进去即热加载生效
      - ./skills/packs:/app/skills/packs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38473/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ─────────────────────────────────────────────────────────────
# 可选：重型部署（多人共用 / 高并发）
# 启用方式：docker compose --profile scale up -d
# 并在 agent 服务的 environment 中加上：
#   DATABASE_URL: postgresql+asyncpg://lumu:lumu@postgres:5432/lumu_agent
#   REDIS_URL: redis://redis:6379/0
# ─────────────────────────────────────────────────────────────
  postgres:
    profiles: ["scale"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumu
      POSTGRES_PASSWORD: lumu
      POSTGRES_DB: lumu_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: ["scale"]
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
